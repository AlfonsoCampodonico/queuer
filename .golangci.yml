version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      check-type-assertions: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AlfonsoCampodonico/queuer
